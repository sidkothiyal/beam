[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beam-deploy"
version = "0.1.0"
description = "Remote GPU training deployment toolkit — provision, sync, and run on RunPod & Vast.ai"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "rich>=13.0",
]

[project.scripts]
beam = "beam.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/beam"]
