# Beam configuration for the elemental project
# Place this file as beam.yaml in the elemental project root.
#
# Usage:
#   beam run --provider vast.ai --pulse 5m --pulse-idle-stop -- \
#     "uv run python src/data_processor/download.py --download_dir=./data --dataset_name=div2k && \
#      uv run python src/trainer.py experiment/autoencoder/compression_ae.yaml"

project:
  name: elemental
  docker_image: elemental
  dep_files: [pyproject.toml, uv.lock]

registry:
  ghcr_image_name: loom-env
  ghcr_tag: latest
  # Requires GITHUB_USERNAME and DOCKER_GHRC_TOKEN (or GITHUB_TOKEN) in env

remote:
  project_dir: /workspace
  home: /root
  user: root

ssh:
  connect_timeout: 20
  retry_attempts: 5
  retry_interval: 10

credentials:
  # All credentials are optional. Set values here or via env vars
  # (env always takes priority over yaml values).
  #
  # -- Provider API keys -------------------------------------------------------
  #   runpod_api_key: ""         # env: RUNPOD_API_KEY
  #   vast_api_key: ""           # env: VAST_API_KEY
  #
  # -- Registry / GitHub -------------------------------------------------------
  #   github_username: ""        # env: GITHUB_USERNAME
  #   docker_ghcr_token: ""      # env: DOCKER_GHRC_TOKEN
  #
  # -- Env vars forwarded to remote ~/.bashrc ----------------------------------
  # Named credentials above are forwarded automatically. Listed here for
  # explicitness; add any additional arbitrary env vars as needed.
  env_vars:
    - WANDB_API_KEY
    - HUGGING_FACE_HUB_TOKEN
    - GITHUB_USERNAME
    - RUNPOD_API_KEY
    - VAST_API_KEY
    - DOCKER_GHRC_TOKEN

  # -- Credential files synced to remote (path relative to remote_home) --------
  credential_files:
    - local: ~/.kaggle/kaggle.json
      remote: .kaggle/kaggle.json
      chmod: "600"

providers:
  runpod:
    configs:
      - name: a40
        gpu_type: "NVIDIA A40"
        gpu_count: 1
        cloud_tier: secure
        spot: true
        recovery_policy: new
        image: "runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404"
        container_disk_size: 30
        volume_size: 50
        volume_path: /workspace
        network_volume_id: ghkc70e22v
        min_memory_gb: 20
        ports: ["22/tcp"]
        ssh_public_key_files:
          - ~/.ssh/id_ed25519.pub
          - ~/.ssh/id_ed25519_sid.pub

      - name: l40s
        gpu_type: "NVIDIA L40S"
        gpu_count: 1
        cloud_tier: secure
        spot: true
        recovery_policy: new
        image: "runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404"
        container_disk_size: 30
        volume_size: 50
        volume_path: /workspace
        network_volume_id: gdfzdf07b5
        min_memory_gb: 20
        ports: ["22/tcp"]
        ssh_public_key_files:
          - ~/.ssh/id_ed25519.pub
          - ~/.ssh/id_ed25519_sid.pub

    fallback_order: [a40, l40s]

  vastai:
    # Pick strategies (which offer to select):
    #   best_value  — (default) highest dlperf_per_dphtotal (DLPerf/$/hr)
    #   cheapest    — lowest min_bid
    #   score       — best (dlperf * reliability / min_bid)
    #
    # Bid strategies (how to price the bid):
    #   multiplier  — (default) bid = min_bid * bid_multiplier
    #   percentile  — bid at the Nth percentile of all min_bid values
    #   fixed       — bid = price field directly
    configs:
      # Generic search: no GPU model pinned, min 50 DLPerf, min 24GB VRAM
      - name: default
        instance_label: elemental-training
        gpu_ram_min: 24          # minimum 24GB VRAM per GPU
        num_gpus_max: 1          # cap GPUs so DLPerf reflects per-GPU performance
        dlperf_min: 50
        offer_type: bid
        offer_limit: 30
        # pick_strategy: best_value  # default — highest DLPerf/$/hr
        # bid_strategy: multiplier   # default — bid at min_bid * bid_multiplier
        bid_multiplier: 1.1      # 10% above host minimum for stability
        price: 0.075             # floor for progressive-bidding fallback ($/hr)
        price_max: 0.250         # absolute cap ($/hr)
        price_step: 0.005
        disk_gb: 50
        recovery_policy: new
        onstart: "chmod 700 /root/.ssh && chmod 600 /root/.ssh/authorized_keys && chown root:root /root/.ssh /root/.ssh/authorized_keys"

      # GPU-name pinned config
      - name: a100_pcie
        instance_label: elemental-training
        gpu_name: "A100 PCIE"
        num_gpus: 1
        machine_id: 56759
        offer_type: bid
        offer_limit: 10
        # pick_strategy: best_value  # default
        bid_multiplier: 1.2
        price: 0.160
        price_max: 0.200
        price_step: 0.005
        disk_gb: 50
        recovery_policy: new
        onstart: "chmod 700 /root/.ssh && chmod 600 /root/.ssh/authorized_keys && chown root:root /root/.ssh /root/.ssh/authorized_keys"

    fallback_order: [default, a100_pcie]

pulse:
  interval: 5m            # default cron interval used when `beam run` omits --pulse
  idle_stop: true         # stop the instance when the GPU goes idle (default for --pulse-idle-stop)
  gpu_idle_threshold: 5
  gpu_idle_max_strikes: 3
  gpu_idle_samples: 5
  gpu_idle_sample_interval: 2
  max_retries: 5

  # -- Agent mode (optional) --------------------------------------------------
  # When enabled, failure states (failed/crashed/outbid/provider_down) are routed
  # to an LLM that reads logs/history/metrics to decide recovery, and stops
  # crash-loops instead of restarting forever. Off by default. Store the API key
  # with `beam pulse agent set-key --provider nim` (never put it in this file).
  # Requires the optional extra: uv pip install -e ".[agent]"
  agent:
    enabled: false
    llm:
      provider: nim                       # nim (default) | openrouter | openai
      model: qwen/qwen3.5-397b-a17b
      api_key_env: NVIDIA_API_KEY
    use_wandb: true
    wandb_entity: elemental-ai
    wandb_project: elemental
    allow_server_switch: true
    advisory: false                       # true = log recommendations without acting
    # escalate_command: "curl -X POST https://hooks.slack.com/... -d \"$BEAM_ROOT_CAUSE\""
    # Canonical project knowledge fed to the agent every check (committed, human-
    # editable; the agent maintains its own marker-delimited section). "" disables.
    project_doc: BEAM_AGENT.md
    read_job_log: true                    # agent can read the unified per-job run+pulse log
